<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobMatch AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f6f6;
      --bg-soft: #fefefe;
      --ink: #111111;
      --ink-soft: #353535;
      --muted: #777777;
      --line: #d9d9d9;
      --line-strong: #101010;
      --radius: 4px;
      --ease-out: cubic-bezier(0.21, 1, 0.23, 1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', 'Avenir Next', 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    .shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 255, 255, 0.95), transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(238, 238, 238, 0.85), transparent 38%),
        linear-gradient(180deg, #fbfbfb 0%, #f2f2f2 100%);
    }

    .shell::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(transparent 96%, rgba(0, 0, 0, 0.02) 100%),
        repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.015) 0px, rgba(0, 0, 0, 0.015) 1px, transparent 1px, transparent 5px);
      opacity: 0.4;
      z-index: 0;
    }

    .shell::after {
      content: '';
      position: absolute;
      left: 33%;
      top: 16%;
      width: 56%;
      height: 1px;
      background: var(--line-strong);
      transform: rotate(-42deg) scaleX(0);
      transform-origin: left center;
      opacity: 0.7;
      animation: draw-line 1.3s 0.25s var(--ease-out) forwards;
      z-index: 1;
      pointer-events: none;
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(250, 250, 250, 0.65);
      backdrop-filter: blur(2px);
      animation: lift-in 700ms var(--ease-out) both;
    }

    .logo {
      width: 32px; height: 32px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--ink);
      flex-shrink: 0;
      background: var(--bg-soft);
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    header p {
      font-size: 10.5px;
      color: var(--muted);
      margin-left: auto;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .panels {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 420px 1fr;
      overflow: hidden;
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      border-right: 1px solid var(--line);
      overflow-y: auto;
      background: rgba(250, 250, 250, 0.52);
      backdrop-filter: blur(1px);
      animation: lift-in 760ms 80ms var(--ease-out) both;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    textarea {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: 'Space Grotesk', monospace;
      font-size: 12.5px;
      line-height: 1.55;
      padding: 12px 14px;
      resize: vertical;
      transition: border-color 0.18s, background 0.18s;
      outline: none;
      width: 100%;
    }

    textarea:focus {
      border-color: var(--line-strong);
      background: #ffffff;
    }

    textarea::placeholder { color: #b1b1b1; }

    #resume       { min-height: 200px; }
    #jobDesc      { min-height: 160px; }
    #appQuestions { min-height: 120px; }

    .char-count {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      letter-spacing: 0.06em;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      border: 1px solid var(--ink);
      transition: transform 0.2s var(--ease-out), background 0.2s, color 0.2s;
    }

    .btn-primary {
      background: var(--ink);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #ffffff;
      color: var(--ink);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .results-panel {
      position: relative;
      overflow-y: auto;
      padding: 28px 36px;
      background: transparent;
      animation: lift-in 840ms 120ms var(--ease-out) both;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      height: 100%;
      gap: 8px;
      color: var(--muted);
      text-align: right;
      padding: 20px 6px 32px;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      border: 1px solid var(--line-strong);
      background: #fff;
      font-size: 0;
      transform: rotate(8deg);
      margin-bottom: 6px;
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.06);
    }

    .empty-state h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 5.6vw, 64px);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 0.95;
      color: var(--ink);
      max-width: 560px;
    }

    .empty-state p {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      max-width: 420px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    #stream-output {
      display: none;
      font-family: 'Space Grotesk', monospace;
      font-size: 12.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: var(--ink-soft);
      padding-bottom: 40px;
    }

    #rendered-output {
      display: none;
      padding-bottom: 60px;
    }

    .analysis-shell {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .insight-grid {
      display: grid;
      grid-template-columns: minmax(210px, 260px) 1fr;
      gap: 12px;
      margin-bottom: 2px;
    }

    .metric-card,
    .strength-card {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 14px;
    }

    .metric-label,
    .strength-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-ring {
      --score-color: #111111;
      --score-angle: 0deg;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: conic-gradient(var(--score-color) var(--score-angle), #ececec 0deg);
      position: relative;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .score-ring::after {
      content: '';
      position: absolute;
      inset: 6px;
      background: #fff;
      border-radius: 50%;
      border: 1px solid #f2f2f2;
    }

    .score-ring-value {
      position: relative;
      z-index: 1;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .score-detail {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.35;
    }

    .strength-bars {
      display: flex;
      gap: 4px;
      width: 100%;
      height: 10px;
      margin: 6px 0 10px;
    }

    .strength-segment {
      height: 100%;
      border-radius: 999px;
      min-width: 2px;
    }

    .strength-segment.strong { background: #101010; }
    .strength-segment.medium { background: #5a5a5a; }
    .strength-segment.weak { background: #9a9a9a; }
    .strength-segment.missing { background: #d3d3d3; }

    .strength-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
    }

    .strength-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      padding: 2px 8px;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .result-card summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink);
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background 0.16s;
    }

    .result-card summary::-webkit-details-marker { display: none; }
    .result-card summary:hover { background: #f8f8f8; }
    .result-card[open] summary { border-bottom-color: var(--line); }

    .result-card .summary-meta {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .result-card .card-body {
      padding: 12px 14px;
      animation: card-open 280ms var(--ease-out) both;
    }

    @keyframes card-open {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--ink);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #rendered-output h2 {
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      margin: 32px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      letter-spacing: -0.2px;
      text-transform: uppercase;
    }

    #rendered-output h2:first-child { margin-top: 0; }

    #rendered-output h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-soft);
      margin: 20px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #rendered-output p {
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 14px;
    }

    #rendered-output ul, #rendered-output ol {
      margin: 8px 0 12px 20px;
    }
    #rendered-output li {
      margin-bottom: 5px;
      font-size: 14px;
      color: var(--ink);
    }

    #rendered-output strong {
      color: #000;
      font-weight: 600;
    }

    #rendered-output hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 24px 0;
    }

    #rendered-output table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--line);
    }

    #rendered-output th {
      background: #f0f0f0;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 9px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    #rendered-output td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      vertical-align: top;
    }

    #rendered-output tr:hover td { background: #f4f4f4; }

    #rendered-output td:last-child {
      white-space: nowrap;
    }

    #rendered-output code {
      background: #f5f5f5;
      border: 1px solid #ececec;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: 'Space Grotesk', monospace;
      font-size: 12.5px;
      color: #222;
    }

    #rendered-output pre {
      background: #f8f8f8;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }

    #rendered-output pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--ink);
      font-size: 13px;
    }

    #rendered-output blockquote {
      border-left: 2px solid var(--line-strong);
      padding: 10px 16px;
      margin: 12px 0;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--ink-soft);
      font-size: 13.5px;
    }

    .error-banner {
      background: #fff;
      border: 1px solid #1a1a1a;
      border-radius: var(--radius);
      color: #1a1a1a;
      padding: 14px 18px;
      font-size: 13.5px;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      background: #ffffff;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 3px 9px;
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), background 0.15s;
      white-space: nowrap;
      user-select: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .upload-btn:hover {
      transform: translateY(-1px);
      background: #f7f7f7;
    }

    .upload-btn.loading { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

    .file-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--ink);
    }

    .file-badge.visible { display: flex; }

    .file-badge-name {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
      font-weight: 500;
    }

    .file-badge-clear {
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      font-size: 14px;
      padding: 0 2px;
    }

    .file-badge-clear:hover { color: #000; }

    @keyframes lift-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes draw-line {
      to { transform: rotate(-42deg) scaleX(1); }
    }

    @media (max-width: 800px) {
      .shell::after {
        left: 35%;
        top: 24%;
        width: 68%;
      }

      .panels {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .form-panel {
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 18px;
      }

      .results-panel {
        padding: 20px 18px 26px;
      }

      .empty-state {
        align-items: flex-start;
        text-align: left;
        justify-content: center;
        padding: 12px 2px 20px;
      }

      .empty-state h2 {
        font-size: clamp(32px, 12vw, 48px);
      }

      .insight-grid {
        grid-template-columns: 1fr;
      }

      header p { display: none; }
    }

    @media (max-width: 520px) {
      .label-row {
        align-items: flex-start;
        gap: 8px;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="logo">J</div>
      <h1>JobMatch AI</h1>
      <p>Career Intelligence Interface</p>
    <a href="/apply" style="color:inherit">Apply workspace &amp; Chrome extension →</a>
    </header>

    <div class="panels">
      <!-- Form -->
      <div class="form-panel">
        <div class="input-group">
          <div class="label-row">
            <label for="resume">Your Resume</label>
            <label class="upload-btn" id="uploadBtn" title="Upload PDF, DOCX, or TXT">
              ↑ Upload file
              <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" style="display:none" onchange="handleFileUpload(this)" />
            </label>
          </div>
          <div class="file-badge" id="fileBadge">
            <span class="file-badge-name" id="fileBadgeName"></span>
            <span class="file-badge-clear" title="Clear file" onclick="clearFile()">✕</span>
          </div>
          <textarea id="resume" placeholder="Paste your full resume text here, or upload a file above…" oninput="updateCount('resume','resumeCount')"></textarea>
          <div class="char-count"><span id="resumeCount">0</span> chars</div>
        </div>

        <div class="input-group">
          <label>Job Description</label>
          <textarea id="jobDesc" placeholder="Paste the job description here…" oninput="updateCount('jobDesc','jobDescCount')"></textarea>
          <div class="char-count"><span id="jobDescCount">0</span> chars</div>
        </div>

        <div class="input-group">
          <label>Application Questions (Optional)</label>
          <textarea id="appQuestions" placeholder="Paste any application questions you want help answering (one per line)…" oninput="updateCount('appQuestions','appQuestionsCount')"></textarea>
          <div class="char-count"><span id="appQuestionsCount">0</span> chars</div>
        </div>

        <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">
          Analyze Fit
        </button>
      </div>

      <!-- Results -->
      <div class="results-panel">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon"></div>
          <h2>Shape a sharper fit between role and resume.</h2>
          <p>Paste your resume and job details, then run analysis.</p>
        </div>

        <div id="stream-output"></div>
        <div id="rendered-output"></div>
      </div>
    </div>
  </div>

  <script>
    const marked = window.marked;
    marked.setOptions({ breaks: true, gfm: true });

    function updateCount(textareaId, countId) {
      const len = document.getElementById(textareaId).value.length;
      document.getElementById(countId).textContent = len.toLocaleString();
    }

    let isStreaming = false;
    let accumulatedText = '';

    function setLoading(loading) {
      const btn = document.getElementById('analyzeBtn');
      if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Analyzing…';
      } else {
        btn.disabled = false;
        btn.innerHTML = 'Analyze Fit';
      }
    }

    function showStream() {
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('rendered-output').style.display = 'none';
      const el = document.getElementById('stream-output');
      el.style.display = 'block';
      el.innerHTML = '';
      return el;
    }

    function finalizeRender(text) {
      document.getElementById('stream-output').style.display = 'none';
      const el = document.getElementById('rendered-output');
      el.style.display = 'block';
      renderStructuredOutput(el, text);
    }

    function parseSections(markdownText) {
      const sections = [];
      const regex = /^##\s+(.+)$/gm;
      const matches = [...markdownText.matchAll(regex)];

      if (!matches.length) return sections;

      for (let i = 0; i < matches.length; i += 1) {
        const title = matches[i][1].trim();
        const start = matches[i].index + matches[i][0].length;
        const end = i + 1 < matches.length ? matches[i + 1].index : markdownText.length;
        const body = markdownText.slice(start, end).trim();
        sections.push({ title, body });
      }

      return sections;
    }

    function extractFitScore(markdownText) {
      const match = markdownText.match(/Fit Score\*\*:\s*([0-9]+(?:\.[0-9]+)?)\s*\/\s*10/i);
      if (!match) return null;
      const value = Number(match[1]);
      if (!Number.isFinite(value)) return null;
      return Math.max(0, Math.min(10, value));
    }

    function extractStrengthCounts(markdownText) {
      const counts = { strong: 0, medium: 0, weak: 0, missing: 0 };
      const lines = markdownText.split('\n');

      for (const line of lines) {
        const rowMatch = line.match(/\|\s*[^|]+\|\s*[^|]+\|\s*(Strong|Medium|Weak|Missing)\s*\|/i);
        if (!rowMatch) continue;
        const key = rowMatch[1].toLowerCase();
        if (counts[key] !== undefined) counts[key] += 1;
      }

      return counts;
    }

    function renderInsights(score, strengthCounts) {
      const scorePercent = score !== null ? Math.round((score / 10) * 100) : 0;
      const level = score === null ? 'Pending' : score >= 8 ? 'Strong fit' : score >= 6 ? 'Moderate fit' : 'Needs work';

      const total = Object.values(strengthCounts).reduce((sum, count) => sum + count, 0);
      const segment = (key) => {
        if (!total || !strengthCounts[key]) return '';
        const width = Math.max(6, Math.round((strengthCounts[key] / total) * 100));
        return `<span class="strength-segment ${key}" style="width:${width}%"></span>`;
      };

      return `
        <div class="insight-grid">
          <div class="metric-card">
            <div class="metric-label">Fit Score</div>
            <div class="score-row">
              <div class="score-ring" style="--score-angle:${Math.round((scorePercent / 100) * 360)}deg;">
                <span class="score-ring-value">${score !== null ? score.toFixed(1) : '—'}</span>
              </div>
              <div class="score-detail">
                <div>${level}</div>
                <div>${score !== null ? `${scorePercent}% alignment` : 'Analyze to see score'}</div>
              </div>
            </div>
          </div>
          <div class="strength-card">
            <div class="strength-label">Requirements Coverage</div>
            <div class="strength-bars">
              ${segment('strong')}
              ${segment('medium')}
              ${segment('weak')}
              ${segment('missing')}
            </div>
            <div class="strength-legend">
              <span class="strength-pill">Strong ${strengthCounts.strong}</span>
              <span class="strength-pill">Medium ${strengthCounts.medium}</span>
              <span class="strength-pill">Weak ${strengthCounts.weak}</span>
              <span class="strength-pill">Missing ${strengthCounts.missing}</span>
            </div>
          </div>
        </div>
      `;
    }

    function cleanSectionTitle(title) {
      return title.replace(/^\d+\.\s*/, '').trim();
    }

    function renderStructuredOutput(container, markdownText) {
      const sections = parseSections(markdownText);
      if (!sections.length) {
        container.innerHTML = marked.parse(markdownText);
        return;
      }

      const score = extractFitScore(markdownText);
      const strengthCounts = extractStrengthCounts(markdownText);

      let html = `<div class="analysis-shell">${renderInsights(score, strengthCounts)}`;

      sections.forEach((section, index) => {
        const title = cleanSectionTitle(section.title);
        const bodyHtml = marked.parse(section.body || '_No content generated._');
        const meta = index === 0 ? 'Start Here' : `${section.body.split(/\s+/).filter(Boolean).length} words`;

        html += `
          <details class="result-card" ${index < 2 ? 'open' : ''}>
            <summary>
              <span>${title}</span>
              <span class="summary-meta">${meta}</span>
            </summary>
            <div class="card-body">${bodyHtml}</div>
          </details>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function showError(message) {
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('stream-output').style.display = 'none';
      const el = document.getElementById('rendered-output');
      el.style.display = 'block';
      el.innerHTML = `<div class="error-banner">⚠️ ${message}</div>`;
    }

    async function analyze() {
      const resume = document.getElementById('resume').value.trim();
      const jobDesc = document.getElementById('jobDesc').value.trim();
      const applicationQuestions = document.getElementById('appQuestions').value.trim();

      if (!resume) { alert('Please paste your resume.'); return; }
      if (!jobDesc) { alert('Please paste the job description.'); return; }
      if (isStreaming) return;

      isStreaming = true;
      accumulatedText = '';
      setLoading(true);

      const streamEl = showStream();
      let cursorEl = document.createElement('span');
      cursorEl.className = 'cursor';
      streamEl.appendChild(cursorEl);

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            resume,
            job_description: jobDesc,
            application_questions: applicationQuestions || null,
          }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || `Server error ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6);
            if (raw === '[DONE]') {
              finalizeRender(accumulatedText);
              isStreaming = false;
              setLoading(false);
              return;
            }

            try {
              const parsed = JSON.parse(raw);
              if (parsed.error) {
                showError(parsed.error);
                isStreaming = false;
                setLoading(false);
                return;
              }
              if (parsed.text) {
                accumulatedText += parsed.text;
                // Update raw stream view (insert before cursor)
                const textNode = document.createTextNode(parsed.text);
                streamEl.insertBefore(textNode, cursorEl);
                // Keep results panel scrolled to bottom during stream
                streamEl.parentElement.scrollTop = streamEl.parentElement.scrollHeight;
              }
            } catch {
              // Ignore malformed SSE lines
            }
          }
        }

        // Stream ended without [DONE] — still render what we have
        if (accumulatedText) finalizeRender(accumulatedText);

      } catch (err) {
        showError(err.message || 'An unexpected error occurred.');
      } finally {
        isStreaming = false;
        setLoading(false);
      }
    }

    async function handleFileUpload(input) {
      const file = input.files[0];
      if (!file) return;

      const btn = document.getElementById('uploadBtn');
      btn.classList.add('loading');
      btn.querySelector('input').disabled = true;

      try {
        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch('/extract-text', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
          alert(data.detail || 'Failed to extract text from file.');
          return;
        }

        const textarea = document.getElementById('resume');
        textarea.value = data.text;
        updateCount('resume', 'resumeCount');

        // Show badge
        document.getElementById('fileBadgeName').textContent = file.name;
        document.getElementById('fileBadge').classList.add('visible');
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        btn.classList.remove('loading');
        btn.querySelector('input').disabled = false;
        // Reset so the same file can be re-uploaded if needed
        input.value = '';
      }
    }

    function clearFile() {
      document.getElementById('resume').value = '';
      updateCount('resume', 'resumeCount');
      document.getElementById('fileBadge').classList.remove('visible');
      document.getElementById('fileBadgeName').textContent = '';
    }

    // Allow Cmd/Ctrl+Enter to submit
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') analyze();
    });
  </script>
</body>
